<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--ink:#14213d;--mute:#6b6a64;--gold:#a8832f;--line:#e3d9c3;--navy:#14213d;--onnavy:#f6f1e7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1526;--card:#15203a;--ink:#f1ead9;--mute:#a7a89f;--gold:#c9a24a;--line:#2a3757;--navy:#0a111f;--onnavy:#f1ead9}}
:root[data-theme="dark"]{--bg:#0d1526;--card:#15203a;--ink:#f1ead9;--mute:#a7a89f;--gold:#c9a24a;--line:#2a3757;--navy:#0a111f;--onnavy:#f1ead9}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Lato,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-weight:600;margin:0}
.wrap{max-width:560px;margin:0 auto;padding:0 18px 40px}
.top{background:var(--navy);color:var(--onnavy);border-bottom:2px solid var(--gold);padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:56px;width:auto;display:block}
.logo{display:block;width:110px;max-width:40%;height:auto;margin:0 auto 22px}
.crest{width:40px;height:40px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-family:"Cormorant Garamond",Georgia,serif;font-size:17px;font-weight:700;letter-spacing:.5px}
.brand b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;letter-spacing:1.5px;line-height:1.1}
.brand small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.link{background:none;border:1px solid var(--gold);color:var(--gold);padding:7px 14px;font:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border-radius:2px}
.hero{background:var(--navy);color:var(--onnavy);text-align:center;padding:34px 22px 34px}
.hero h1{font-size:34px;letter-spacing:1px}
.hero p{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:11px;margin:10px 0 0}
.orn{width:70px;height:1px;background:var(--gold);margin:16px auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:20px;margin-top:16px}
label{display:block;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mute);margin:14px 0 6px}
input{width:100%;padding:13px 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:2px}
input:focus{outline:2px solid var(--gold);outline-offset:0}
.btn{width:100%;margin-top:20px;padding:14px;background:var(--navy);color:var(--gold);border:1px solid var(--gold);font:inherit;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:2px}
.err{color:#b3392f;font-size:13px;margin-top:12px;min-height:18px}
.hint{font-size:12px;color:var(--mute);text-align:center;margin-top:14px}
.hello{padding:26px 0 4px}
.hello small{color:var(--gold);letter-spacing:2px;text-transform:uppercase;font-size:11px}
.hello h2{font-size:30px;margin-top:4px}
.sec{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.m{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;border-left:3px solid var(--gold)}
.m h3{font-size:21px;margin:6px 0 2px}
.m .meta{font-size:13px;color:var(--mute)}
.m .last{font-size:14px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border:1px solid var(--gold);color:var(--gold);border-radius:2px}
.next{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-top:12px;background:var(--bg);padding:9px 12px;border-radius:2px}
.next b{color:var(--gold)}
.back{background:none;border:0;color:var(--gold);font:inherit;font-size:13px;letter-spacing:1px;text-transform:uppercase;padding:20px 0 4px;cursor:pointer}
.tl{position:relative;margin:18px 0 0 8px;padding-left:22px;border-left:1px solid var(--gold)}
.ev{position:relative;padding-bottom:22px}
.ev::before{content:"";position:absolute;left:-28px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}
.ev:first-child::before{background:var(--gold)}
.ev .d{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);font-weight:700}
.ev h3{font-size:19px;margin:2px 0 3px}
.ev p{margin:0;font-size:14px;color:var(--mute)}
.foot{text-align:center;margin-top:34px;font-size:12px;color:var(--mute);line-height:1.8}
.foot b{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;color:var(--ink);letter-spacing:1px}
.hide{display:none}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.dng{border-color:#b3392f;color:#b3392f;background:transparent}
textarea{width:100%;padding:13px 12px;font:inherit;font-size:16px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:2px}
.upd{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.req{margin-top:10px;font:700 11px Lato,Arial,sans-serif;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.req::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-inline-end:8px}
.todo{border-left:3px solid var(--gold);padding:14px 16px;margin-top:10px}
.todo.done{opacity:.6;border-left-color:var(--line);font-size:14px}
html[dir=rtl] .todo{border-left:1px solid var(--line);border-right:3px solid var(--gold)}
html[dir=rtl] .todo.done{border-right-color:var(--line)}
.top{direction:ltr}.link{white-space:nowrap}
@media (max-width:430px){.brand b{font-size:15px;white-space:nowrap;letter-spacing:1px}.brand small{white-space:nowrap}.link{padding:7px 10px}.brand{gap:9px}}.acts{display:flex;gap:8px}
html[dir=rtl] *{letter-spacing:0!important;text-transform:none!important}
html[dir=rtl] body{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.8}
html[dir=rtl] h1,html[dir=rtl] h2,html[dir=rtl] h3,html[dir=rtl] .serif{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,serif}
html[dir=rtl] .m{text-align:right;border-left:1px solid var(--line);border-right:3px solid var(--gold)}
html[dir=rtl] .tl{margin:18px 8px 0 0;padding:0 22px 0 0;border-left:0;border-right:1px solid var(--gold)}
html[dir=rtl] .ev::before{left:auto;right:-28px}
html[dir=rtl] .back{display:block;width:100%;text-align:right}
#u,#p{direction:ltr}
</style>

const nd=s=>String(s).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-0x660).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-0x6F0).replace(/\s+/g,"");

const app=document.getElementById("app");let me=null,cur=null;
const head=out=>`<div class="top"><div class="brand"><img src="${LG}" alt="Belal Nasr El-Din Law Firm"><div><b>BELAL NASR EL-DIN</b><small>Law Firm · Since 1991</small></div></div><div class="acts"><button class="link" id="lg">${t("lg")}</button>${out?`<button class="link" id="out">${t("out")}</button>`:""}</div></div>`;
const pend=m=>{const n=(m.actions||[]).filter(a=>!a.done).length;return n?`<div class="req">${t("req")} (${n})</div>`:""};
const acts=m=>{const a=m.actions||[];if(!a.length)return"";const p=a.filter(x=>!x.done),d=a.filter(x=>x.done);return `<div class="sec">${t("act")}</div>`+p.map(x=>`<div class="card todo"><b><bdi>${E(x.a)}</bdi></b>${x.due?`<div class="meta">${t("due")}: ${fd(x.due)}</div>`:""}</div>`).join("")+d.map(x=>`<div class="card todo done"><span>✓ <bdi>${E(x.a)}</bdi></span></div>`).join("")};
const foot=()=>`<div class="foot"><b>${t("fn")}</b><br>${t("since")}<br>${t("conf")}</div>`;
function wire(){document.getElementById("lg").onclick=()=>{L=L==="ar"?"en":"ar";try{localStorage.setItem("bnl",L)}catch(e){}setDir();cur()};const o=document.getElementById("out");if(o)o.onclick=login}
function login(){cur=login;me=null;app.innerHTML=head(false)+`<div class="hero"><img class="logo" src="${LG}" alt="Belal Nasr El-Din Law Firm"><h1>${t("portal")}</h1><div class="orn"></div><p>${t("tag")}</p></div>
<div class="wrap"><div class="card"><h2 style="font-size:26px">${t("wel")}</h2><div class="serif" style="color:var(--mute);font-size:17px">${t("sub")}</div>
<label for="u">${t("cid")}</label><input id="u" autocomplete="username" autocapitalize="characters" placeholder="BN-0000">
<label for="p">${t("pin")}</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
<div class="err" id="e"></div><button class="btn" id="go">${t("si")}</button></div>
${foot()}</div>`;wire();
 const go=async()=>{const u=nd(document.getElementById("u").value).toUpperCase(),p=nd(document.getElementById("p").value),e=document.getElementById("e"),g=document.getElementById("go");
  if(!u||!p){e.textContent=t("ent");return}
  g.disabled=true;g.textContent=t("sing");e.textContent="";
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({id:u,pin:p})});const d=await r.json();
   if(d.error){e.textContent=tr(d.error);g.disabled=false;g.textContent=t("si");return}
   me=d;home()}catch(x){e.textContent=t("conn");g.disabled=false;g.textContent=t("si")}};
 document.getElementById("go").onclick=go;
 document.getElementById("p").onkeydown=e=>{if(e.key==="Enter")go()}}
function home(){cur=home;
 app.innerHTML=head(true)+`<div class="wrap"><div class="hello"><small>${t("back")}</small><h2><bdi>${E(me.name)}</bdi></h2></div>
 <div class="sec">${t("ym")} (${me.matters.length})</div>
 ${me.matters.map((m,i)=>`<button class="card m" data-i="${i}"><span class="badge">${E(tr(m.status))}</span><h3><bdi>${E(m.title)}</bdi></h3>
 <div class="meta"><bdi>${E(m.no)}</bdi> · ${E(tr(m.type))}</div>
 <div class="last">${m.updates[0]?`<b>${t("lat")}</b> <bdi>${E(m.updates[0].t)}</bdi><div class="meta">${fd(m.updates[0].d)}</div>`:t("nou")}</div>

function detail(i){cur=()=>detail(i);const m=me.matters[i];

 <span class="badge">${E(tr(m.status))}</span><h2 style="font-size:30px;margin-top:8px"><bdi>${E(m.title)}</bdi></h2>
 <div class="card"><div class="meta" style="font-size:14px;color:var(--mute)"><bdi>${E(m.no)}</bdi><br>${E(tr(m.type))} · <bdi>${E(tr(m.court))}</bdi></div>
